name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ===== INSTALAR DEPENDENCIAS Y EJECUTAR PRUEBAS =====
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # ===== CONSTRUIR IMAGEN DOCKER (ARTEFACTO INMUTABLE) =====
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/simulador-tactico:latest
            ${{ secrets.DOCKER_USERNAME }}/simulador-tactico:${{ github.sha }}

      # ===== DESPLEGAR EN VERCEL (PRODUCCIÓN) =====
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel --prod --token=$VERCEL_TOKEN --yes

      # ===== VERIFICAR HEALTH CHECK (OPCIONAL) =====
      - name: Verify health check
        run: |
          sleep 10
          curl -f https://simulador-interactivo-de-toma-de-de.vercel.app/health || exit 1
          echo "✅ Health check passed"